<mat-toolbar color="primary" class="shell__toolbar">
  <button mat-icon-button aria-label="Toggle navigation" (click)="sidenavOpen.set(!sidenavOpen())">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="shell__title">Speak Ukrainian — Admin</span>
  <span class="shell__spacer"></span>

  @if (user(); as currentUser) {
    <button mat-button [matMenuTriggerFor]="accountMenu">
      <mat-icon>account_circle</mat-icon>
      {{ currentUser.email }}
      <span class="shell__role">{{ currentUser.role }}</span>
    </button>
    <mat-menu #accountMenu="matMenu">
      <button mat-menu-item (click)="signOut()">
        <mat-icon>logout</mat-icon>
        <span>Sign out</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>

<mat-sidenav-container class="shell__container">
  <mat-sidenav mode="side" [opened]="sidenavOpen()" class="shell__sidenav">
    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="is-active">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell__content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
