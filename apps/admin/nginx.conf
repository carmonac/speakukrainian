server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed bundles never change under the same name.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must not be cached, or a deploy would keep serving the old
  # bundle references to returning users.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # The admin uses real routes, so any deep link has to fall back to the SPA
  # shell instead of 404ing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
