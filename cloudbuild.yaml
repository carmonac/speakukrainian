# Deploys all three services to Cloud Run.
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=europe-west1,_PROJECT=your-project-id
#
# Runtime configuration lives in Secret Manager and Cloud Run env vars, never
# in this file.

substitutions:
  _REGION: europe-west1
  _REPO: speakukrainian
  _STORAGE_BUCKET: speakukrainian-media

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/admin:${SHORT_SHA}'

steps:
  # ---- build (the three images are independent, so they run concurrently) ----
  - id: build-api
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}'
      - .

  - id: build-web
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - -t
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${SHORT_SHA}'
      - .

  - id: build-admin
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args:
      - build
      - -f
      - apps/admin/Dockerfile
      - -t
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/admin:${SHORT_SHA}'
      - .

  # ---- deploy ---------------------------------------------------------------
  # The API goes first: the public site renders against it, so deploying the
  # site before the API it depends on would serve errors during the gap.
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: ['build-api']
    args:
      - run
      - deploy
      - speakukrainian-api
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=speakukrainian-api@${PROJECT_ID}.iam.gserviceaccount.com
      - --set-env-vars=NODE_ENV=production,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},STORAGE_BUCKET=${_STORAGE_BUCKET}
      # Signs the H5P editor's URL tokens. The API refuses to boot without it,
      # so the Secret Manager entry `h5p-url-token-secret` must exist and the
      # deploy service account must be able to read it *before* this step runs
      # for the first time. Nothing in CI can catch its absence: CI does not
      # deploy.
      - --set-secrets=H5P_URL_TOKEN_SECRET=h5p-url-token-secret:latest
      - --min-instances=0
      - --max-instances=10
      - --cpu=1
      - --memory=1Gi
      # H5P package uploads can be large and slow.
      - --timeout=300
      - --no-allow-unauthenticated

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: ['build-web', 'deploy-api']
    args:
      - run
      - deploy
      - speakukrainian-web
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=speakukrainian-web@${PROJECT_ID}.iam.gserviceaccount.com
      - --set-env-vars=NODE_ENV=production
      # Keeping one instance warm avoids a cold SSR render on the first visit.
      - --min-instances=1
      - --max-instances=20
      - --cpu=1
      - --memory=1Gi
      - --allow-unauthenticated

  - id: deploy-admin
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: ['build-admin']
    args:
      - run
      - deploy
      - speakukrainian-admin
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/admin:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --min-instances=0
      - --max-instances=5
      - --cpu=1
      - --memory=512Mi
      - --allow-unauthenticated
