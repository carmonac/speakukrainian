packages:
  - 'apps/*'
  - 'packages/*'
  - 'scripts'

# Native/postinstall builds we explicitly trust.
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@scarf/scarf': false
  # Its postinstall is a fallback installer: when no native binding loads it
  # shells out to `npm install --no-save @swc/wasm`. The binding ships as a
  # platform package and the lockfile carries one per CI target, so the script
  # has nothing to do and letting it run would put npm inside a pnpm install.
  '@swc/core': false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.66.0'
  - '@typescript-eslint/parser@8.66.0'
  - '@typescript-eslint/project-service@8.66.0'
  - '@typescript-eslint/scope-manager@8.66.0'
  - '@typescript-eslint/tsconfig-utils@8.66.0'
  - '@typescript-eslint/type-utils@8.66.0'
  - '@typescript-eslint/types@8.66.0'
  - '@typescript-eslint/typescript-estree@8.66.0'
  - '@typescript-eslint/utils@8.66.0'
  - '@typescript-eslint/visitor-keys@8.66.0'
  - typescript-eslint@8.66.0
